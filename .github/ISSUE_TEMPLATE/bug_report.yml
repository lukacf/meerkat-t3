name: Bug report
description: Report a reproducible problem with MeerkaT3.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Include only redacted evidence; never upload
        credentials, pairing links, auth callback URLs, or complete profile databases.
        Security vulnerabilities belong in private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: App version from About, or source commit for a development build.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version and desktop app or local web browser.
      placeholder: macOS, Apple Silicon, MeerkaT3 desktop
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project ...
        2. Connect a specialist ...
        3. Send ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste a redacted error or attach screenshots and the built-in support report. Do not attach a profile directory or database.
  - type: textarea
    id: workaround
    attributes:
      label: Workaround or additional context
      description: Include a workaround if you found one. Leave blank otherwise.
