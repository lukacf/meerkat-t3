name: Meerkat Mac package

# Reusable packaging only. Call from the owned Meerkat repository at a reviewed
# source revision. Results are retained as an Actions artifact, not published
# as a release. The caller must already have a qualified native-input artifact.
on:
  workflow_call:
    inputs:
      release_repository:
        description: Canonical owned owner/repo, exactly equal to the calling repository
        required: true
        type: string
      release_environment:
        description: GitHub environment that owns this packaging decision
        required: true
        type: string
      mode:
        description: unsigned, signed or internal-unsigned, with no automatic fallback
        required: true
        type: string
      version:
        required: true
        type: string
      native_inputs_run_id:
        description: Exact numeric run ID that produced the prepared native inputs
        required: true
        type: string
      native_inputs_artifact_id:
        description: Exact numeric artifact ID in the same repository
        required: true
        type: string
      native_inputs_manifest_sha256:
        description: Reviewed SHA256 of meerkat-mac-native-inputs.json
        required: true
        type: string
      enable_updates:
        description: Opt in to the owned repository feed for signed mode only
        default: false
        type: boolean
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    environment: ${{ inputs.release_environment }}
    env:
      MEERKAT_MAC_RELEASE_REPOSITORY: ${{ inputs.release_repository }}
      MEERKAT_MAC_RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
      MEERKAT_MAC_RELEASE_MODE: ${{ inputs.mode }}
      MEERKAT_MAC_RELEASE_VERSION: ${{ inputs.version }}
      MEERKAT_MAC_RELEASE_ENABLE_UPDATES: ${{ inputs.enable_updates }}
      T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
    steps:
      - name: Require native Mac arm64 host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Checkout the reviewed calling revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Set up the declared Node and package manager
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          run-install: false
          cache: true

      - name: Validate public release configuration
        run: node scripts/build-meerkat-mac.ts --plan

      - name: Install the frozen source dependencies
        run: vp install --frozen-lockfile

      - name: Read the exact same-repository artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_inputs_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_inputs_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$NATIVE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$NATIVE_ARTIFACT_ID" > "$RUNNER_TEMP/meerkat-native-artifact.json"

      - name: Download only the pinned native-input artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.native_inputs_run_id }}
          artifact-ids: ${{ inputs.native_inputs_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/meerkat-native-inputs
          merge-multiple: true

      - name: Validate and stage the exact native inputs
        shell: bash
        env:
          NATIVE_RUN_ID: ${{ inputs.native_inputs_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_inputs_artifact_id }}
          NATIVE_MANIFEST_SHA256: ${{ inputs.native_inputs_manifest_sha256 }}
        run: |
          set -euo pipefail
          node scripts/lib/meerkat-mac-native-inputs.ts \
            --bundle-dir "$RUNNER_TEMP/meerkat-native-inputs" \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest-sha256 "$NATIVE_MANIFEST_SHA256" \
            --artifact-metadata "$RUNNER_TEMP/meerkat-native-artifact.json" \
            --artifact-id "$NATIVE_ARTIFACT_ID" \
            --run-id "$NATIVE_RUN_ID" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            > "$RUNNER_TEMP/meerkat-native-input-receipt.json"

      - name: Build the explicit unsigned package
        if: inputs.mode == 'unsigned' || inputs.mode == 'internal-unsigned'
        run: node scripts/build-meerkat-mac.ts

      - name: Build the explicit signed package
        if: inputs.mode == 'signed'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_RAW: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$(mktemp "$RUNNER_TEMP/meerkat-notary-key.XXXXXX")"
          trap 'rm -f "$key_path"' EXIT
          if [ -z "$APPLE_API_KEY_RAW" ]; then
            printf '%s\n' 'Signed Mac packaging requires APPLE_API_KEY.' >&2
            exit 1
          fi
          printf '%s' "$APPLE_API_KEY_RAW" > "$key_path"
          unset APPLE_API_KEY_RAW
          export APPLE_API_KEY="$key_path"
          node scripts/build-meerkat-mac.ts

      - name: Record exact package outputs
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MEERKAT_MAC_RELEASE_MODE" = internal-unsigned ]; then
            package_dir=release-internal
            prefix=Meerkat-T3-INTERNAL-VALIDATION
          else
            package_dir=release-mac
            prefix=Meerkat-T3
          fi
          package_stem="$prefix-$MEERKAT_MAC_RELEASE_VERSION-arm64"
          test -f "$package_dir/$package_stem.dmg"
          test -f "$package_dir/$package_stem.zip"
          test -s "$package_dir/Install Meerkat T3.txt"
          cp "$RUNNER_TEMP/meerkat-native-input-receipt.json" "$package_dir/native-input-receipt.json"
          (cd "$package_dir" && shasum -a 256 "$package_stem.dmg" "$package_stem.zip" > SHA256SUMS)
          printf 'directory=%s\nstem=%s\n' "$package_dir" "$package_stem" >> "$GITHUB_OUTPUT"
          if [ "$MEERKAT_MAC_RELEASE_ENABLE_UPDATES" = true ]; then
            case "$MEERKAT_MAC_RELEASE_VERSION" in
              *-nightly.*) update_manifest=nightly-mac.yml ;;
              *) update_manifest=latest-mac.yml ;;
            esac
            test -s "$package_dir/$update_manifest"
            test -s "$package_dir/$package_stem.dmg.blockmap"
            test -s "$package_dir/$package_stem.zip.blockmap"
            (cd "$package_dir" && shasum -a 256 "$update_manifest" "$package_stem.dmg.blockmap" "$package_stem.zip.blockmap" >> SHA256SUMS)
            printf 'update_manifest=%s/%s\ndmg_blockmap=%s/%s.dmg.blockmap\nzip_blockmap=%s/%s.zip.blockmap\n' \
              "$package_dir" "$update_manifest" "$package_dir" "$package_stem" "$package_dir" "$package_stem" >> "$GITHUB_OUTPUT"
          fi

      - name: Retain the packages and input receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: meerkat-mac-${{ inputs.mode }}-${{ inputs.version }}
          path: |
            ${{ steps.packages.outputs.directory }}/${{ steps.packages.outputs.stem }}.dmg
            ${{ steps.packages.outputs.directory }}/${{ steps.packages.outputs.stem }}.zip
            ${{ steps.packages.outputs.directory }}/SHA256SUMS
            ${{ steps.packages.outputs.directory }}/Install Meerkat T3.txt
            ${{ steps.packages.outputs.directory }}/native-input-receipt.json
            ${{ steps.packages.outputs.update_manifest }}
            ${{ steps.packages.outputs.dmg_blockmap }}
            ${{ steps.packages.outputs.zip_blockmap }}
          if-no-files-found: error
          retention-days: 14
