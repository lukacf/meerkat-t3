name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: Desktop, web, and server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node and Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure Electron before parallel test imports
        run: pnpm --filter @t3tools/desktop ensure:electron
      - name: Check documentation links
        run: pnpm docs:check
      - name: Test native notice input preparation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_prepare_native_notice_inputs.py -v
      - name: Check formatting
        run: pnpm fmt:check
      - name: Lint supported workspaces
        run: >-
          pnpm exec vp lint --report-unused-disable-directives
          apps/desktop apps/server apps/web packages/contracts packages/shared
          packages/client-runtime packages/ssh packages/tailscale scripts
      - name: Typecheck supported workspaces
        run: pnpm typecheck
      - name: Test supported workspaces
        run: pnpm test

  native_macos:
    name: Mac native integration
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node and Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          run-install: false
          cache: true
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure Electron before parallel test imports
        run: pnpm --filter @t3tools/desktop ensure:electron
      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          toolchain: 1.97.0
      - name: Test native contracts and lifecycle
        run: scripts/repo-cargo test --locked -p meerkat-desktop-contracts -p meerkat-desktop-gateway -p meerkat-desktop-stdio -- --test-threads=2
      - name: Build native test executable
        run: scripts/repo-cargo build --locked -p meerkat-desktop-stdio
      - name: Resolve the exact built executable
        shell: bash
        run: |
          set -euo pipefail
          native_target_dir="$(scripts/repo-cargo --print-env | sed -n 's/^CARGO_TARGET_DIR=//p')"
          test -x "$native_target_dir/debug/meerkat-desktop-stdio"
          echo "T3CODE_TEST_MEERKAT_BINARY=$native_target_dir/debug/meerkat-desktop-stdio" >> "$GITHUB_ENV"
      - name: Exercise auth, cancellation, and restart across stdio
        working-directory: apps/server
        run: >-
          pnpm exec vp test run
          src/provider/meerkat/MeerkatAuth.native.test.ts
          src/provider/meerkat/MeerkatGatewayClient.native.test.ts
          src/provider/meerkat/MeerkatGatewayClient.restart.native.test.ts
      - name: Verify runtime staging
        run: pnpm native:build --binary "$T3CODE_TEST_MEERKAT_BINARY"
      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml
      - name: Build the desktop stack
        run: pnpm build:desktop
      - name: Verify preload bundle
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --ignore-gitleaks-allow
          --gitleaks-ignore-path=.gitleaksignore --redact=100 --no-banner .

  gate:
    name: Quality gate
    if: always()
    needs: [typescript, native_macos, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all supported checks
        env:
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          NATIVE_RESULT: ${{ needs.native_macos.result }}
          SECRET_SCAN_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$TYPESCRIPT_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
