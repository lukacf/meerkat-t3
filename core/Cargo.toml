[workspace]
members = ["meerkat-desktop-contracts", "meerkat-desktop-gateway", "meerkat-desktop-stdio"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
jsonschema = { version = "0.26.2", default-features = false }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "io-std",
  "sync",
  "time",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# Keep the runtime and composition layer on the same released 0.9 family.
# The local MobKit alias preserves existing integration names after the
# upstream package was renamed to meerkat-meta.
meerkat = { version = "=0.9.1", features = [
  "comms",
  "skills",
  "mcp",
  "memory-store",
  "jsonl-store",
  "session-store",
  "sqlite-store",
] }
meerkat-mcp = "=0.9.1"
meerkat-core = "=0.9.1"
meerkat-contracts = "=0.9.1"
meerkat-mobkit = { package = "meerkat-meta", version = "=0.9.1" }
meerkat-mob = "=0.9.1"
meerkat-runtime = "=0.9.1"
meerkat-providers = { version = "=0.9.1", features = ["native-keyring", "refresh-file-lock"] }
meerkat-copilot = { version = "=0.9.1", default-features = false, features = ["oauth"] }
meerkat-store = { version = "=0.9.1", features = ["sqlite"] }
meerkat-models = "=0.9.1"
meerkat-sqlite = "=0.9.1"
meerkat-tools = "=0.9.1"
